server.port=8080

# -------------------------------------------------------------
# MySQL Configuration (For transitpay_db in MySQL Workbench)
# Uncomment the block below when running with local MySQL:
# -------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/transitpay_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
